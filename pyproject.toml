[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suxarray"
version = "2025.6.0"
description = "uxarray extension for SCHISM."
readme = "README.rst"
requires-python = ">=3.12"
authors = [
    { name = "California Department of Water Resources", email = "knam@water.ca.gov" },
]
license = { file = "LICENSE" }
keywords = ["suxarray"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "uxarray==2026.10.1",
    "shapely>=2.0",
    "gsw>=3.6", # required for density -> mass calculations in `integrate.py`
    "Click>=7.0"
]

[project.optional-dependencies]
vtk = ["vtk"]

test = ["pytest>=3", "pytest-cov", "vtk"]

[project.urls]
Homepage = "https://github.com/cadwrdeltamodeling/suxarray"

[tool.setuptools.packages.find]
include = ["suxarray", "suxarray.*"]

[project.scripts]
suxarray = "suxarray.cli:main"

[tool.coverage.run]
source = ["suxarray"]
omit = [
    "suxarray/core/test_io.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0
